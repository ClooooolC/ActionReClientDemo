<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>咩了个咩 · 羊了个羊风格三消小游戏</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%91%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink: #3b2a20;
    --ink-soft: #6d5747;
    --cream: #fffaf0;
    --paper: #fdf5e6;
    --green: #5da653;
    --green-deep: #3f7b37;
    --wood: #b97a49;
    --wood-dark: #86522f;
    --shadow: 0 18px 40px rgba(68, 62, 38, .16);
    --tile: 64px;
    --step: 72px;
    --board-scale: 1;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
    background: #dff0e6;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    text-rendering: optimizeLegibility;
  }

  button { font: inherit; color: inherit; }
  body.overlay-open { overflow: hidden; }

  .bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    overflow: hidden;
    background:
      radial-gradient(circle at 78% 8%, rgba(255, 247, 194, .9) 0 5%, transparent 22%),
      linear-gradient(180deg, #d8f0fa 0%, #e9f7e9 48%, #d8eccb 100%);
  }

  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(91, 132, 75, .09) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: .55;
    mask-image: linear-gradient(180deg, transparent 0 42%, #000 100%);
  }

  .sun {
    position: absolute;
    top: 5%;
    right: 12%;
    width: clamp(90px, 13vw, 180px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #fffbe0 0 18%, #ffe9a4 52%, #ffd978 100%);
    box-shadow: 0 0 0 18px rgba(255, 236, 158, .16), 0 0 80px 30px rgba(255, 226, 135, .35);
    opacity: .9;
  }

  .cloud {
    position: absolute;
    width: 160px;
    height: 52px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .78);
    filter: blur(.2px);
    box-shadow: 42px -18px 0 -4px rgba(255, 255, 255, .78), 84px 4px 0 -10px rgba(255, 255, 255, .68);
    animation: cloudDrift 24s ease-in-out infinite alternate;
    opacity: .85;
  }

  .cloud.c1 { top: 12%; left: 7%; }
  .cloud.c2 { top: 28%; right: 5%; width: 120px; height: 42px; animation-duration: 32s; animation-delay: -8s; opacity: .55; }
  .cloud.c3 { top: 4%; left: 42%; width: 92px; height: 34px; animation-duration: 28s; animation-delay: -15s; opacity: .5; }

  .hills {
    position: absolute;
    left: -2%;
    right: -2%;
    bottom: -2px;
    width: 104%;
    height: min(40vh, 440px);
    opacity: .95;
  }

  .game-shell {
    width: min(980px, calc(100% - 28px));
    min-height: 100svh;
    margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) 0 max(14px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }

  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 2px 4px 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .brand-mark {
    width: 44px;
    height: 44px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 15px;
    background: linear-gradient(160deg, #fffdf7, #f3e6d2);
    border: 2px solid #fff;
    box-shadow: 0 4px 0 rgba(139, 104, 70, .25), 0 8px 18px rgba(93, 73, 49, .14);
    transform: rotate(-4deg);
  }

  .brand-mark svg { width: 34px; height: 34px; }

  .brand-copy h1 {
    margin: 0;
    font-size: clamp(19px, 2.4vw, 25px);
    line-height: 1.05;
    letter-spacing: .04em;
    font-weight: 900;
    color: #33502c;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .8);
  }

  .brand-copy p {
    margin: 3px 0 0;
    font-size: 11px;
    letter-spacing: .2em;
    color: #7a8b6c;
    font-weight: 600;
  }

  .hud {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 12px;
    border-radius: 999px;
    background: rgba(255, 252, 244, .86);
    border: 1.5px solid rgba(255, 255, 255, .9);
    box-shadow: 0 3px 0 rgba(127, 107, 72, .13), 0 7px 16px rgba(86, 99, 66, .08);
    color: #5f6b50;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    backdrop-filter: blur(6px);
  }

  .chip b {
    color: #345c2c;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }

  .chip .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #79bb63;
    box-shadow: 0 0 0 3px rgba(121, 187, 99, .18);
  }

  .icon-btn {
    width: 34px;
    height: 34px;
    flex: none;
    display: grid;
    place-items: center;
    padding: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, .95);
    background: rgba(255, 252, 244, .86);
    box-shadow: 0 3px 0 rgba(127, 107, 72, .13), 0 7px 16px rgba(86, 99, 66, .08);
    cursor: pointer;
    color: #5f6b50;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    backdrop-filter: blur(6px);
  }

  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn:hover { background: #fffdf7; transform: translateY(-1px); }
  .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(127, 107, 72, .13); }
  .icon-btn[aria-pressed="false"] { color: #a4a495; }

  main.game {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 11px;
    min-height: 0;
  }

  .board-panel {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .board {
    position: relative;
    width: min(100%, 720px, max(300px, calc((100svh - 360px) * 1.363636)));
    aspect-ratio: 600 / 440;
    border-radius: clamp(20px, 4vw, 32px);
    border: clamp(3px, .45vw, 5px) solid rgba(255, 255, 255, .82);
    background:
      radial-gradient(circle at 50% 8%, rgba(255, 255, 255, .62), transparent 52%),
      repeating-linear-gradient(45deg, rgba(255, 255, 255, .055) 0 2px, transparent 2px 7px),
      repeating-linear-gradient(-45deg, rgba(74, 120, 58, .035) 0 1px, transparent 1px 6px),
      linear-gradient(180deg, #d7ecce 0%, #c5e2ba 56%, #b9d9ad 100%);
    box-shadow:
      inset 0 0 0 1px rgba(83, 125, 67, .18),
      inset 0 12px 26px rgba(255, 255, 255, .32),
      inset 0 -16px 30px rgba(73, 111, 58, .12),
      0 18px 38px rgba(61, 87, 48, .18);
    overflow: hidden;
    touch-action: manipulation;
  }

  .board::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(255, 255, 255, .22) 0 2px, transparent 3px),
      radial-gradient(circle at 87% 72%, rgba(255, 255, 255, .18) 0 2px, transparent 3px),
      radial-gradient(circle at 70% 14%, rgba(74, 112, 57, .12) 0 1px, transparent 2px);
    background-size: 86px 86px, 112px 112px, 54px 54px;
    pointer-events: none;
    opacity: .8;
  }

  .board::after {
    content: "";
    position: absolute;
    inset: 9px;
    border-radius: calc(clamp(20px, 4vw, 32px) - 7px);
    border: 1px dashed rgba(76, 116, 60, .15);
    pointer-events: none;
  }

  .board-inner {
    position: absolute;
    left: 0;
    top: 0;
    width: 600px;
    height: 440px;
    transform-origin: top left;
    transform: scale(var(--board-scale));
  }

  .tile {
    position: absolute;
    width: var(--tile);
    height: var(--tile);
    padding: 0;
    border: 2px solid var(--tile-edge);
    border-radius: 15px;
    background: var(--tile-bg);
    cursor: pointer;
    user-select: none;
    appearance: none;
    -webkit-appearance: none;
    box-shadow:
      0 4px 0 var(--tile-edge),
      0 8px 13px rgba(63, 47, 29, .2),
      inset 0 2px 0 rgba(255, 255, 255, .92),
      inset 0 -3px 0 rgba(92, 67, 44, .08);
    transition: transform .14s ease, box-shadow .14s ease, filter .2s ease;
    animation: tileIn .42s cubic-bezier(.2, .9, .3, 1.35) backwards;
    touch-action: manipulation;
    z-index: 1;
    overflow: hidden;
  }

  .tile::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 13px;
    background:
      radial-gradient(circle at 30% 18%, rgba(255, 255, 255, .9), transparent 38%),
      linear-gradient(180deg, rgba(255, 255, 255, .4), transparent 54%);
    pointer-events: none;
  }

  .tile::after {
    content: "";
    position: absolute;
    left: 14%;
    right: 14%;
    bottom: 4px;
    height: 5px;
    border-radius: 50%;
    background: rgba(78, 54, 34, .08);
    filter: blur(3px);
    pointer-events: none;
  }

  .tile-icon {
    position: relative;
    z-index: 1;
    display: block;
    width: 72%;
    height: 72%;
    margin: 14% auto 0;
    pointer-events: none;
    filter: drop-shadow(0 1px 0 rgba(255, 255, 255, .7));
  }

  .tile:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow:
      0 7px 0 var(--tile-edge),
      0 13px 18px rgba(63, 47, 29, .22),
      inset 0 2px 0 rgba(255, 255, 255, .95),
      inset 0 -3px 0 rgba(92, 67, 44, .08);
  }

  .tile:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--tile-edge), 0 4px 8px rgba(63, 47, 29, .18); }

  .tile:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 3px;
    box-shadow: 0 0 0 6px rgba(70, 139, 60, .65), 0 5px 0 var(--tile-edge);
  }

  .tile.blocked {
    cursor: default;
    filter: grayscale(.42) brightness(.8) saturate(.75);
    box-shadow:
      0 3px 0 var(--tile-edge),
      0 5px 8px rgba(49, 40, 27, .14),
      inset 0 1px 0 rgba(255, 255, 255, .45);
  }

  .tile.is-gone { display: none; }

  .tile .lock-dots {
    position: absolute;
    z-index: 2;
    right: 5px;
    bottom: 5px;
    display: none;
    gap: 2px;
  }

  .tile.blocked .lock-dots { display: flex; }
  .lock-dots i { width: 3px; height: 3px; border-radius: 50%; background: rgba(70, 52, 36, .34); }

  .board-empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    font-size: clamp(12px, 1.8vw, 15px);
    font-weight: 800;
    color: #57744a;
    text-align: center;
    letter-spacing: .04em;
    pointer-events: none;
    z-index: 5;
  }

  .board-empty[hidden] { display: none; }

  .tray-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    margin-top: 2px;
  }

  .tray-shelf {
    position: relative;
    width: min(100%, 640px, max(300px, calc((100svh - 360px) * 1.363636)));
    padding: 9px 13px 13px;
    border-radius: 20px;
    border: 2.5px solid #834f2e;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .28), transparent 28%),
      repeating-linear-gradient(90deg, rgba(73, 38, 17, .08) 0 2px, transparent 2px 42px),
      linear-gradient(180deg, #d8a06d 0%, #c48550 55%, #b47443 100%);
    box-shadow:
      0 6px 0 #7c4a2a,
      0 14px 24px rgba(74, 47, 27, .25),
      inset 0 1px 0 rgba(255, 255, 255, .5),
      inset 0 -8px 14px rgba(92, 48, 20, .16);
    transition: transform .2s ease;
  }

  .tray-shelf.shake { animation: trayShake .5s ease; }

  .tray-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 16px;
    padding: 0 5px 6px;
    color: #fff3df;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .18em;
    text-shadow: 0 1px 0 rgba(82, 42, 18, .4);
  }

  .tray-meta .tray-count { font-variant-numeric: tabular-nums; letter-spacing: .08em; }

  .tray-shelf.is-full {
    box-shadow:
      0 6px 0 #7c4a2a,
      0 0 0 3px rgba(214, 75, 61, .72),
      0 14px 28px rgba(126, 53, 35, .3),
      inset 0 1px 0 rgba(255, 255, 255, .5);
    animation: trayWarn .8s ease infinite alternate;
  }

  .tray-slots {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: clamp(4px, 1vw, 8px);
  }

  .slot {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 11px;
    background: linear-gradient(180deg, rgba(86, 47, 22, .34), rgba(110, 62, 30, .2));
    box-shadow:
      inset 0 3px 7px rgba(67, 33, 13, .32),
      inset 0 -1px 0 rgba(255, 255, 255, .16),
      0 1px 0 rgba(255, 255, 255, .2);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .slot.empty::after {
    content: "";
    width: 58%;
    height: 58%;
    border-radius: 8px;
    border: 2px dashed rgba(255, 243, 223, .2);
  }

  .slot.filled { overflow: visible; }

  .mini-tile {
    width: 100%;
    height: 100%;
    border-radius: 10px;
    border: 1.5px solid var(--tile-edge);
    background: var(--tile-bg);
    display: grid;
    place-items: center;
    box-shadow:
      0 2.5px 0 var(--tile-edge),
      0 4px 7px rgba(54, 31, 16, .25),
      inset 0 1.5px 0 rgba(255, 255, 255, .9);
    position: relative;
    overflow: hidden;
  }

  .mini-tile::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 14%, rgba(255, 255, 255, .85), transparent 42%);
  }

  .mini-tile svg {
    position: relative;
    z-index: 1;
    width: 72%;
    height: 72%;
  }

  .slot.just-added .mini-tile { animation: slotPop .32s cubic-bezier(.2, 1.1, .3, 1.4); }
  .slot.matching .mini-tile { animation: matchPop .3s ease forwards; }
  .slot.matching::after {
    content: "";
    position: absolute;
    inset: -7px;
    border-radius: 16px;
    border: 2px solid rgba(255, 241, 156, .9);
    animation: matchRing .3s ease forwards;
    pointer-events: none;
  }

  .hold-area {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: min(100%, 640px, max(300px, calc((100svh - 360px) * 1.363636)));
    padding: 2px 0 0;
  }

  .hold-area.is-visible { display: flex; animation: fadeUp .25s ease; }

  .hold-label {
    color: #6c7c5c;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .18em;
    white-space: nowrap;
  }

  .hold-slots { display: flex; gap: 6px; }

  .hold-slot {
    width: clamp(34px, 5.2vw, 42px);
    aspect-ratio: 1;
    padding: 0;
    border-radius: 10px;
    border: 1.5px dashed rgba(88, 117, 70, .3);
    background: rgba(255, 252, 244, .5);
    display: grid;
    place-items: center;
  }

  button.hold-slot {
    cursor: pointer;
    border-style: solid;
    border-color: var(--tile-edge);
    background: var(--tile-bg);
    box-shadow: 0 2.5px 0 var(--tile-edge), 0 5px 8px rgba(54, 31, 16, .18);
    transition: transform .14s ease, box-shadow .14s ease;
  }

  button.hold-slot:hover { transform: translateY(-2px); }
  button.hold-slot:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--tile-edge); }
  button.hold-slot svg { width: 74%; height: 74%; }
  button.hold-slot:focus-visible { outline: 3px solid #fff; outline-offset: 2px; box-shadow: 0 0 0 5px rgba(70, 139, 60, .55); }
  .hold-slot.empty::after { content: ""; width: 45%; height: 45%; border-radius: 5px; border: 1.5px dashed rgba(88, 117, 70, .24); }

  .props {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    padding-top: 2px;
  }

  .prop-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 38px;
    padding: 0 12px 0 10px;
    border-radius: 13px;
    border: 2px solid #e4d2b6;
    background: linear-gradient(180deg, #fffdf7, #f7ecd9);
    box-shadow: 0 3px 0 #d5bd9c, 0 6px 12px rgba(86, 65, 42, .1);
    color: #6c5038;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: transform .14s ease, box-shadow .14s ease, opacity .2s ease;
    touch-action: manipulation;
  }

  .prop-btn svg { width: 17px; height: 17px; color: #8b6a4c; }
  .prop-btn:hover:not(:disabled) { transform: translateY(-1px); background: #fffdf8; }
  .prop-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #d5bd9c; }
  .prop-btn:disabled { opacity: .48; cursor: not-allowed; filter: grayscale(.5); }

  .prop-btn .prop-count {
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    display: inline-grid;
    place-items: center;
    background: #79b466;
    color: #fff;
    font-size: 10px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .15);
  }

  .prop-btn.used .prop-count { background: #b9b2a6; }

  .prop-btn:focus-visible, .icon-btn:focus-visible, .primary-btn:focus-visible, .ghost-btn:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
    box-shadow: 0 0 0 5px rgba(70, 139, 60, .55);
  }

  .page-foot {
    flex: none;
    padding-top: 9px;
    text-align: center;
    color: #7c8b6e;
    font-size: 10px;
    letter-spacing: .12em;
    font-weight: 600;
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    background:
      radial-gradient(circle at 50% 35%, rgba(255, 255, 255, .16), transparent 55%),
      rgba(31, 56, 38, .46);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    transition: opacity .26s ease, visibility .26s ease;
  }

  .overlay[hidden] { display: none; }
  .overlay.is-closing { opacity: 0; visibility: hidden; pointer-events: none; }

  .start-card, .end-card {
    position: relative;
    z-index: 2;
    width: min(520px, 100%);
    max-height: calc(100svh - 36px);
    overflow: auto;
    padding: clamp(20px, 3.5vw, 30px);
    border-radius: 30px;
    border: 3px solid rgba(255, 255, 255, .92);
    background:
      radial-gradient(circle at 50% 0%, rgba(255, 255, 255, .9), transparent 46%),
      linear-gradient(180deg, #fffdf7 0%, #fbf2e2 100%);
    box-shadow:
      0 24px 60px rgba(30, 51, 31, .32),
      inset 0 0 0 1px rgba(164, 135, 93, .12);
    text-align: center;
    animation: cardIn .4s cubic-bezier(.2, .9, .3, 1.08);
    scrollbar-width: none;
  }

  .start-card::-webkit-scrollbar, .end-card::-webkit-scrollbar { display: none; }

  .start-card::before, .end-card::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 22px;
    border: 1px dashed rgba(136, 106, 68, .18);
    pointer-events: none;
  }

  .mascot-wrap {
    width: clamp(104px, 18vw, 140px);
    margin: -6px auto 2px;
    filter: drop-shadow(0 12px 14px rgba(92, 78, 48, .14));
    animation: floaty 4s ease-in-out infinite;
  }

  .mascot-wrap svg { display: block; width: 100%; height: auto; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 0 0 4px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #eaf4e2;
    color: #5d7d4d;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .18em;
  }

  .start-card h2, .end-card h2 {
    margin: 2px 0 8px;
    color: #34502c;
    font-size: clamp(26px, 5vw, 38px);
    line-height: 1.12;
    font-weight: 900;
    letter-spacing: .04em;
  }

  .lead {
    margin: 0 auto;
    max-width: 360px;
    color: #786553;
    font-size: 13px;
    line-height: 1.7;
    font-weight: 600;
  }

  .how {
    display: grid;
    gap: 7px;
    margin: 16px auto 18px;
    max-width: 360px;
    text-align: left;
  }

  .how-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 10px;
    border-radius: 12px;
    background: rgba(255, 255, 255, .62);
    border: 1px solid rgba(174, 146, 105, .16);
    color: #675441;
    font-size: 12px;
    line-height: 1.45;
    font-weight: 600;
  }

  .how-item .step {
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: #e7f2dd;
    color: #5d8a4b;
    font-size: 11px;
    font-weight: 900;
    transform: rotate(-4deg);
  }

  .how-item b { color: #3f5c34; }

  .primary-btn, .ghost-btn {
    min-height: 48px;
    border-radius: 15px;
    padding: 0 22px;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: .04em;
    cursor: pointer;
    transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
    touch-action: manipulation;
  }

  .primary-btn {
    border: 2px solid #43863a;
    color: #fff;
    background: linear-gradient(180deg, #82c86e 0%, #61ae51 58%, #56a047 100%);
    box-shadow: 0 5px 0 #3f7b37, 0 12px 20px rgba(66, 124, 55, .24);
    text-shadow: 0 1px 0 rgba(38, 92, 32, .3);
  }

  .primary-btn:hover { transform: translateY(-1px); background: linear-gradient(180deg, #8bd177, #65b455); }
  .primary-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #3f7b37, 0 5px 10px rgba(66, 124, 55, .2); }

  .primary-btn .btn-sub {
    display: inline-block;
    margin-left: 7px;
    padding-left: 8px;
    border-left: 1px solid rgba(255, 255, 255, .35);
    font-size: 10.5px;
    letter-spacing: .06em;
    opacity: .9;
    font-weight: 700;
  }

  .ghost-btn {
    border: 2px solid #e2d0b3;
    background: rgba(255, 253, 247, .9);
    color: #7b634b;
    box-shadow: 0 3px 0 #d9c4a3;
  }

  .ghost-btn:hover { background: #fffdf7; transform: translateY(-1px); }
  .ghost-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #d9c4a3; }

  .start-actions { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
  .start-hint { margin: 0; color: #9b8b78; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; }

  .end-card { width: min(460px, 100%); }
  .end-badge {
    width: 74px;
    height: 74px;
    margin: 0 auto 8px;
    display: grid;
    place-items: center;
    border-radius: 24px;
    background: linear-gradient(160deg, #fffdf3, #f5e5bd);
    border: 2px solid #fff;
    box-shadow: 0 7px 0 #e6cd96, 0 14px 24px rgba(119, 91, 45, .18);
    font-size: 38px;
    transform: rotate(-3deg);
  }

  .end-card.is-lost .end-badge { background: linear-gradient(160deg, #fff8f5, #f3ded7); box-shadow: 0 7px 0 #e3c1b6, 0 14px 24px rgba(119, 74, 55, .16); }

  .end-text { margin: 0 auto 16px; max-width: 330px; color: #7c6a57; font-size: 12.5px; line-height: 1.7; font-weight: 600; }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin: 0 auto 18px;
    max-width: 340px;
  }

  .stat {
    padding: 9px 4px 8px;
    border-radius: 12px;
    background: rgba(250, 242, 227, .9);
    border: 1px solid rgba(188, 154, 105, .18);
  }

  .stat b { display: block; color: #4a643c; font-size: 19px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stat span { display: block; margin-top: 2px; color: #9b8871; font-size: 9.5px; font-weight: 700; letter-spacing: .12em; }

  .end-actions { display: flex; flex-direction: column; gap: 9px; }
  .end-actions .ghost-btn { min-height: 42px; font-size: 12.5px; }

  .confetti {
    position: fixed;
    inset: 0;
    z-index: 150;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .flying-tile {
    position: fixed;
    z-index: 200;
    pointer-events: none;
    border-radius: 13px;
    border: 2px solid var(--tile-edge);
    background: var(--tile-bg);
    box-shadow: 0 4px 0 var(--tile-edge), 0 8px 16px rgba(49, 33, 18, .28);
    display: grid;
    place-items: center;
    will-change: transform, opacity;
  }

  .flying-tile svg { width: 72%; height: 72%; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    z-index: 220;
    transform: translate(-50%, 18px);
    max-width: min(90vw, 420px);
    padding: 10px 16px;
    border-radius: 999px;
    background: rgba(46, 57, 39, .92);
    color: #fffdf4;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .02em;
    box-shadow: 0 8px 22px rgba(31, 42, 27, .28);
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s ease, transform .2s ease, visibility .2s ease;
    text-align: center;
  }

  .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @keyframes tileIn {
    from { opacity: 0; transform: translateY(9px) scale(.86); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes slotPop {
    0% { transform: scale(.72) rotate(-4deg); }
    65% { transform: scale(1.06) rotate(1deg); }
    100% { transform: scale(1) rotate(0); }
  }

  @keyframes matchPop {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.16); opacity: 1; }
    100% { transform: scale(.3); opacity: 0; }
  }

  @keyframes matchRing {
    0% { opacity: .9; transform: scale(.86); }
    100% { opacity: 0; transform: scale(1.28); }
  }

  @keyframes trayShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px) rotate(-.6deg); }
    40% { transform: translateX(6px) rotate(.5deg); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(3px); }
  }

  @keyframes trayWarn {
    from { filter: saturate(1); }
    to { filter: saturate(1.25) brightness(1.03); }
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(18px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-6px) rotate(1deg); }
  }

  @keyframes cloudDrift {
    from { transform: translateX(-12px); }
    to { transform: translateX(18px); }
  }

  @keyframes sheepBlink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%, 97% { transform: scaleY(.12); }
  }

  .mascot-eye { transform-origin: center; animation: sheepBlink 5s infinite; }

  @media (max-width: 640px) {
    .game-shell { width: calc(100% - 18px); padding-top: 9px; }
    .topbar { padding-bottom: 8px; gap: 8px; }
    .brand-mark { width: 38px; height: 38px; border-radius: 13px; }
    .brand-mark svg { width: 29px; height: 29px; }
    .brand-copy p { display: none; }
    .chip { height: 30px; padding: 0 9px; font-size: 10.5px; gap: 4px; }
    .chip b { font-size: 13px; }
    .icon-btn { width: 30px; height: 30px; }
    .icon-btn svg { width: 15px; height: 15px; }
    main.game { gap: 8px; }
    .tray-shelf { border-radius: 17px; padding: 7px 9px 10px; }
    .tray-meta { font-size: 9px; height: 14px; padding-bottom: 5px; }
    .slot { border-radius: 8px; }
    .mini-tile { border-radius: 7px; }
    .props { gap: 6px; }
    .prop-btn { height: 34px; padding: 0 10px 0 8px; font-size: 10.5px; gap: 5px; border-radius: 11px; }
    .prop-btn svg { width: 14px; height: 14px; }
    .prop-btn .prop-count { min-width: 16px; height: 16px; font-size: 9px; }
    .page-foot { display: none; }
    .start-card, .end-card { border-radius: 24px; padding: 20px 18px; }
    .how { margin: 13px auto 15px; }
    .how-item { font-size: 11px; padding: 7px 9px; }
    .lead { font-size: 12px; }
    .primary-btn, .ghost-btn { min-height: 44px; font-size: 13px; }
    .end-badge { width: 62px; height: 62px; border-radius: 20px; font-size: 31px; }
    .stats { margin-bottom: 14px; }
  }

  @media (max-width: 380px) {
    .chip.level-chip { display: none; }
    .prop-btn .prop-label { display: none; }
    .prop-btn { width: 42px; padding: 0; justify-content: center; }
    .prop-btn .prop-count { position: absolute; top: -5px; right: -5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>

<div class="game-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48"><use href="#i-sheep"></use></svg>
      </div>
      <div class="brand-copy">
        <h1>咩了个咩</h1>
        <p>三消叠叠乐</p>
      </div>
    </div>
    <div class="hud">
      <span class="chip level-chip"><span class="dot"></span>第 <b id="levelNum">1</b> 关</span>
      <span class="chip">剩余 <b id="remainNum">45</b></span>
      <button class="icon-btn" id="soundBtn" type="button" aria-label="关闭音效" aria-pressed="true" title="音效">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use id="soundIcon" href="#i-sound"></use></svg>
      </button>
      <button class="icon-btn" id="restartBtn" type="button" aria-label="重开本关" title="重开本关">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-restart"></use></svg>
      </button>
    </div>
  </header>

  <main class="game">
    <div class="board-panel">
      <div class="board" id="board" aria-label="牌堆">
        <div class="board-inner" id="boardInner"></div>
        <div class="board-empty" id="boardEmpty" hidden>牌堆清空啦<br>把暂存区的牌收进卡槽吧</div>
      </div>
    </div>

    <section class="tray-panel" aria-label="卡槽区">
      <div class="hold-area" id="holdArea">
        <span class="hold-label">暂存区</span>
        <div class="hold-slots" id="holdSlots"></div>
      </div>

      <div class="tray-shelf" id="trayShelf">
        <div class="tray-meta">
          <span>卡 槽</span>
          <span class="tray-count" id="trayCount">0 / 7</span>
        </div>
        <div class="tray-slots" id="traySlots" aria-label="卡槽，最多放 7 张牌"></div>
      </div>

      <div class="props">
        <button class="prop-btn" id="undoBtn" type="button" title="撤销上一张牌">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-undo"></use></svg>
          <span class="prop-label">撤销</span>
          <span class="prop-count" id="undoCount">1</span>
        </button>
        <button class="prop-btn" id="shuffleBtn" type="button" title="重新打乱桌面牌面">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-shuffle"></use></svg>
          <span class="prop-label">洗牌</span>
          <span class="prop-count" id="shuffleCount">1</span>
        </button>
        <button class="prop-btn" id="removeBtn" type="button" title="把卡槽前排的牌移到暂存区">

<div class="toast" id="toast" role="status"></div>
<div class="sr-only" id="live" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const BOARD_W = 600;
  const BOARD_H = 440;
  const TILE = 64;
  const STEP = 72;
  const MAX_TRAY = 7;
  const MAX_HOLD = 3;

  const TYPES = [
    { id: 'grass',    name: '青草',   bg: '#e8f5d8', edge: '#a6cc78' },
    { id: 'carrot',   name: '胡萝卜', bg: '#ffeadb', edge: '#efa96e' },
    { id: 'corn',     name: '玉米',   bg: '#fff4cd', edge: '#e4c25b' },
    { id: 'mushroom', name: '蘑菇',   bg: '#ffe4e0', edge: '#e59b94' },
    { id: 'flower',   name: '小花',   bg: '#fbe3f1', edge: '#dda1c5' },
    { id: 'sheep',    name: '小羊',   bg: '#eaf2fb', edge: '#a2bcdf' },
    { id: 'yarn',     name: '毛线',   bg: '#eee7fb', edge: '#b4a4dc' },
    { id: 'bell',     name: '铃铛',   bg: '#fff0d7', edge: '#e1b66c' }
  ];
  const TYPE_MAP = new Map(TYPES.map(t => [t.id, t]));

  const LEVELS = [
    {
      label: '第一关',
      layers: [{ cols: 6, rows: 4 }, { cols: 5, rows: 3 }, { cols: 3, rows: 2 }],
      typeCount: 6,
      easy: true
    },
    {
      label: '第二关',
      layers: [{ cols: 6, rows: 5 }, { cols: 5, rows: 4 }, { cols: 4, rows: 4 }, { cols: 3, rows: 2 }],
      typeCount: 8,
      easy: false
    }
  ];

  const $ = sel => document.querySelector(sel);
  const gameShell = document.querySelector('.game-shell');
  const board = $('#board');
  const boardInner = $('#boardInner');
  const boardEmpty = $('#boardEmpty');
  const trayShelf = $('#trayShelf');
  const traySlotsEl = $('#traySlots');
  const trayCountEl = $('#trayCount');
  const holdArea = $('#holdArea');
  const holdSlotsEl = $('#holdSlots');
  const levelNum = $('#levelNum');
  const remainNum = $('#remainNum');
  const soundBtn = $('#soundBtn');
  const soundIcon = $('#soundIcon');
  const restartBtn = $('#restartBtn');
  const undoBtn = $('#undoBtn');
  const shuffleBtn = $('#shuffleBtn');
  const removeBtn = $('#removeBtn');
  const undoCount = $('#undoCount');
  const shuffleCount = $('#shuffleCount');
  const removeCount = $('#removeCount');
  const startOverlay = $('#startOverlay');
  const startBtn = $('#startBtn');
  const endOverlay = $('#endOverlay');
  const endCard = $('#endCard');
  const endBadge = $('#endBadge');
  const endTitle = $('#endTitle');
  const endText = $('#endText');
  const statTime = $('#statTime');
  const statMoves = $('#statMoves');
  const statCleared = $('#statCleared');
  const nextBtn = $('#nextBtn');
  const replayBtn = $('#replayBtn');
  const homeBtn = $('#homeBtn');
  const toastEl = $('#toast');
  const liveEl = $('#live');
  const confettiCanvas = $('#confetti');
  const debugMode = new URLSearchParams(location.search).has('debug');

  const state = {
    levelIndex: 0,
    status: 'idle',
    epoch: 0,
    lock: false,
    positions: [],
    tiles: [],
    tileMap: new Map(),
    tray: [],
    hold: [],
    history: [],
    props: { undo: 1, shuffle: 1, remove: 1 },
    matching: new Set(),
    justAdded: null,
    total: 0,
    moves: 0,
    startedAt: 0,
    endedAt: 0,
    solution: [],
    sound: true
  };

  const traySlotEls = [];
  let toastTimer = 0;
  let startClosing = false;
  let confettiRun = 0;

  /* ------------------------------ sound ------------------------------ */

  let audioCtx = null;

  function ensureAudio() {
    if (!state.sound) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  }

  function tone(freq, duration = 0.08, type = 'sine', volume = 0.045, delay = 0) {
    if (!state.sound || !audioCtx) return;
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume), t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  }

  function playSfx(name) {
    if (!state.sound) return;
    ensureAudio();
    if (!audioCtx) return;
    try {
      if (name === 'pick') {
        tone(560, 0.06, 'sine', 0.035);
        tone(760, 0.05, 'sine', 0.025, 0.035);
      } else if (name === 'match') {
        tone(660, 0.1, 'triangle', 0.045);
        tone(880, 0.12, 'triangle', 0.04, 0.07);
        tone(1120, 0.16, 'sine', 0.04, 0.14);
      } else if (name === 'undo') {
        tone(500, 0.07, 'sine', 0.03);
        tone(360, 0.09, 'sine', 0.025, 0.05);
      } else if (name === 'shuffle') {
        tone(430, 0.05, 'square', 0.018);
        tone(620, 0.05, 'square', 0.018, 0.05);
        tone(820, 0.07, 'square', 0.018, 0.1);
      } else if (name === 'remove') {
        tone(720, 0.07, 'sine', 0.03);
        tone(980, 0.09, 'sine', 0.025, 0.05);
      } else if (name === 'win') {
        [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.18, 'triangle', 0.045, i * 0.11));
      } else if (name === 'lose') {
        tone(300, 0.2, 'sawtooth', 0.025);
        tone(230, 0.25, 'sawtooth', 0.02, 0.16);
        tone(160, 0.4, 'sawtooth', 0.015, 0.34);
      } else if (name === 'start') {
        tone(520, 0.06, 'sine', 0.03);
        tone(780, 0.08, 'sine', 0.03, 0.06);
      } else if (name === 'nope') {
        tone(220, 0.08, 'square', 0.02);
        tone(180, 0.1, 'square', 0.018, 0.07);
      }
    } catch (_) {
      /* Audio is a nicety, never let it break the game. */
    }
  }

  function applySoundPreference() {
    try {
      const saved = localStorage.getItem('sheep-sound');
      if (saved === 'off') state.sound = false;
    } catch (_) { /* storage may be unavailable */ }
    soundBtn.setAttribute('aria-pressed', String(state.sound));
    soundBtn.setAttribute('aria-label', state.sound ? '关闭音效' : '开启音效');
    soundIcon.setAttribute('href', state.sound ? '#i-sound' : '#i-mute');
  }

  /* ------------------------------ helpers ------------------------------ */

  function shuffleArray(list) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }

  function typeOf(tile) { return TYPE_MAP.get(tile.type); }
  function tileById(id) { return state.tileMap.get(id); }

  function overlaps(a, b) {
    return a.x < b.x + TILE && a.x + TILE > b.x && a.y < b.y + TILE && a.y + TILE > b.y;
  }

  function isExposed(position, remainingIds) {
    for (const other of state.positions) {
      if (other.layer > position.layer && remainingIds.has(other.id) && overlaps(other, position)) {
        return false;
      }
    }
    return true;
  }

  function makePositions(level) {
    const positions = [];
    let id = 0;
    level.layers.forEach((layer, layerIndex) => {
      const width = (layer.cols - 1) * STEP + TILE;
      const height = (layer.rows - 1) * STEP + TILE;
      const left = (BOARD_W - width) / 2;
      const top = (BOARD_H - height) / 2;
      for (let row = 0; row < layer.rows; row++) {
        for (let col = 0; col < layer.cols; col++) {
          positions.push({
            id,
            x: left + col * STEP,
            y: top + row * STEP,
            layer: layerIndex,
            type: null
          });
          id += 1;
        }
      }
    });
    return positions;
  }

  function buildSolutionOrder(level) {
    const positions = state.positions;
    const remaining = new Set(positions.map(p => p.id));
    const order = [];
    let initialCount = 0;

    // The first level starts with a fully matchable top: every tile that is
    // visible at the beginning is assigned in triples. This makes the opening
    // friendly while still leaving a real stacked puzzle underneath.
    if (level.easy) {
      const visibleAtStart = positions.filter(p => isExposed(p, remaining));
      const take = Math.floor(visibleAtStart.length / 3) * 3;
      shuffleArray(visibleAtStart);
      visibleAtStart.slice(0, take).forEach(position => {
        order.push(position);
        remaining.delete(position.id);
      });
      initialCount = take;
    }

    while (remaining.size > 0) {
      const exposed = positions.filter(p => remaining.has(p.id) && isExposed(p, remaining));
      if (exposed.length === 0) throw new Error('Could not peel the board');
      const pick = exposed[Math.floor(Math.random() * exposed.length)];
      order.push(pick);
      remaining.delete(pick.id);
    }
    order.initialCount = initialCount;
    return order;
  }

  function assignTypes(order, level) {
    const pool = TYPES.slice(0, level.typeCount);
    const openingPool = pool.slice(0, Math.min(3, pool.length));
    const openingGroups = Math.floor((order.initialCount || 0) / 3);
    order.forEach((position, index) => {
      const group = Math.floor(index / 3);
      const groupPool = group < openingGroups ? openingPool : pool;
      position.type = groupPool[group % groupPool.length].id;
    });
  }

  function formatTime(ms) {
    const total = Math.max(0, Math.round(ms / 1000));
    const minutes = Math.floor(total / 60);
    const seconds = total % 60;
    return `${minutes}:${String(seconds).padStart(2, '0')}`;
  }

  function announce(message) {
    liveEl.textContent = '';
    window.setTimeout(() => { liveEl.textContent = message; }, 30);
  }

  function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  /* ------------------------------ level setup ------------------------------ */

  function initLevel(index, preview = false) {
    const level = LEVELS[index];
    if (!level) return;

    state.epoch += 1;
    state.levelIndex = index;
    state.status = preview ? 'idle' : 'playing';
    state.lock = false;
    state.tray = [];
    state.hold = [];
    state.history = [];
    state.props = { undo: 1, shuffle: 1, remove: 1 };
    state.matching = new Set();
    state.justAdded = null;
    state.moves = 0;
    state.startedAt = preview ? 0 : performance.now();
    state.endedAt = 0;
    state.positions = makePositions(level);
    state.total = state.positions.length;

    document.querySelectorAll('.flying-tile').forEach(el => el.remove());
    toastEl.classList.remove('show');
    confettiRun += 1;
    const confettiCtx = confettiCanvas.getContext('2d');
    if (confettiCtx) confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

    const order = buildSolutionOrder(level);
    assignTypes(order, level);
    state.solution = order.map(p => p.id);

    state.tiles = state.positions.map(position => ({
      ...position,
      status: 'board',
      blocked: false,
      el: null
    }));
    state.tileMap = new Map(state.tiles.map(t => [t.id, t]));

    boardInner.innerHTML = '';
    const fragment = document.createDocumentFragment();
    state.tiles.forEach((tile, i) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'tile';
      el.dataset.tileId = String(tile.id);
      el.style.left = `${tile.x}px`;
      el.style.top = `${tile.y}px`;
      el.style.zIndex = String(10 + tile.layer * 10);
      el.style.animationDelay = `${Math.min(320, tile.layer * 55 + i * 5)}ms`;
      const type = typeOf(tile);
      el.style.setProperty('--tile-bg', type.bg);
      el.style.setProperty('--tile-edge', type.edge);
      el.innerHTML = `
        <svg class="tile-icon" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-${type.id}"></use></svg>
        <span class="lock-dots" aria-hidden="true"><i></i><i></i><i></i></span>`;
      el.addEventListener('click', () => onTileClick(tile));
      tile.el = el;
      fragment.appendChild(el);
    });
    boardInner.appendChild(fragment);

    if (traySlotEls.length === 0) {
      for (let i = 0; i < MAX_TRAY; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot empty';
        traySlotsEl.appendChild(slot);
        traySlotEls.push(slot);
      }
    }

    trayShelf.classList.remove('is-full', 'shake');
    holdArea.classList.remove('is-visible');
    hideEndOverlay();
    levelNum.textContent = String(index + 1);
    if (startOverlay.hidden) {
      /* restarting mid-run should never show the intro again */
    }
    fitBoard();
    refreshAll();
    trayShelf.style.removeProperty('transform');
  }

  /* ------------------------------ render ------------------------------ */

  function fitBoard() {
    const width = board.clientWidth;
    if (width > 0) board.style.setProperty('--board-scale', String(width / BOARD_W));
  }

  function renderBoard() {
    const active = state.tiles.filter(t => t.status === 'board');
    const editable = state.status === 'playing' && !state.lock;

    for (const tile of state.tiles) {
      const el = tile.el;
      if (!el) continue;
      if (tile.status !== 'board') {
        el.classList.add('is-gone');
        el.disabled = true;
        continue;
      }
      el.classList.remove('is-gone');
      const blocked = active.some(other => other !== tile && other.layer > tile.layer && overlaps(other, tile));
      tile.blocked = blocked;
      el.classList.toggle('blocked', blocked);
      el.disabled = blocked || !editable;
      const type = typeOf(tile);
      el.setAttribute('aria-label', `${type.name}，第 ${tile.layer + 1} 层，${blocked ? '被压住' : '可点击'}`);
    }

    const remainingOnBoard = active.length;
    boardEmpty.hidden = !(remainingOnBoard === 0 && state.hold.length > 0 && state.status === 'playing');
  }

  function miniTileHTML(tile, extraClass = '') {
    const type = typeOf(tile);
    return `<div class="mini-tile ${extraClass}" style="--tile-bg:${type.bg};--tile-edge:${type.edge}" title="${type.name}" aria-label="${type.name}">
      <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-${type.id}"></use></svg>
    </div>`;
  }

  function renderTray() {
    trayCountEl.textContent = `${state.tray.length} / ${MAX_TRAY}`;
    trayShelf.classList.toggle('is-full', state.tray.length >= MAX_TRAY);

    for (let i = 0; i < MAX_TRAY; i++) {
      const slot = traySlotEls[i];
      const id = state.tray[i];
      if (id === undefined) {
        slot.className = 'slot empty';
        slot.innerHTML = '';
        slot.setAttribute('aria-label', `空卡槽，第 ${i + 1} 格`);
        continue;
      }
      const tile = tileById(id);
      const type = typeOf(tile);
      const classes = ['slot', 'filled'];
      if (state.justAdded === id) classes.push('just-added');
      if (state.matching.has(id)) classes.push('matching');
      slot.className = classes.join(' ');
      slot.innerHTML = miniTileHTML(tile);
      slot.setAttribute('aria-label', `卡槽第 ${i + 1} 格：${type.name}`);
    }
  }

  function renderHold() {
    const hasHold = state.hold.length > 0;
    holdArea.classList.toggle('is-visible', hasHold);
    if (!hasHold) {
      holdSlotsEl.innerHTML = '';
      return;
    }
    holdSlotsEl.innerHTML = state.hold.map(id => {
      const tile = tileById(id);
      const type = typeOf(tile);
      return `<button class="hold-slot" type="button" data-hold-id="${id}" style="--tile-bg:${type.bg};--tile-edge:${type.edge}" aria-label="暂存区：${type.name}，点击放回卡槽">
        <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-${type.id}"></use></svg>
      </button>`;
    }).join('');
    for (let i = state.hold.length; i < MAX_HOLD; i++) {
      const empty = document.createElement('div');
      empty.className = 'hold-slot empty';
      holdSlotsEl.appendChild(empty);
    }
  }

  function renderHUD() {
    const notRemoved = state.tiles.filter(t => t.status !== 'removed').length;
    remainNum.textContent = String(notRemoved);
    levelNum.textContent = String(state.levelIndex + 1);

    undoCount.textContent = String(state.props.undo);
    shuffleCount.textContent = String(state.props.shuffle);
    removeCount.textContent = String(state.props.remove);
    undoBtn.classList.toggle('used', state.props.undo <= 0);
    shuffleBtn.classList.toggle('used', state.props.shuffle <= 0);
    removeBtn.classList.toggle('used', state.props.remove <= 0);

    const idle = state.status !== 'playing' || state.lock;
    undoBtn.disabled = idle || state.props.undo <= 0 || state.history.length === 0;
    shuffleBtn.disabled = idle || state.props.shuffle <= 0 || !state.tiles.some(t => t.status === 'board');
    removeBtn.disabled = idle || state.props.remove <= 0 || state.tray.length === 0;
  }

  function refreshAll() {
    renderBoard();
    renderTray();
    renderHold();
    renderHUD();
  }

  /* ------------------------------ actions ------------------------------ */

  function onTileClick(tile) {
    if (state.status !== 'playing' || state.lock) return;
    if (tile.status !== 'board' || tile.blocked) return;
    if (state.tray.length >= MAX_TRAY) return;

    const sourceRect = tile.el.getBoundingClientRect();
    const epoch = state.epoch;
    state.lock = true;
    state.moves += 1;
    state.history.push(tile.id);
    tile.status = 'tray';

    let insertAt = -1;
    for (let i = 0; i < state.tray.length; i++) {
      if (typeOf(tileById(state.tray[i])).id === tile.type) insertAt = i;
    }
    if (insertAt === -1) state.tray.push(tile.id);
    else state.tray.splice(insertAt + 1, 0, tile.id);

    const trayIndex = state.tray.indexOf(tile.id);
    state.justAdded = tile.id;
    playSfx('pick');
    refreshAll();

    flyTile(tile, sourceRect, trayIndex);
    window.setTimeout(() => {
      if (epoch !== state.epoch) return;
      state.justAdded = null;
      renderTray();
    }, 340);

    window.setTimeout(() => {
      if (epoch !== state.epoch) return;
      resolveTray();
    }, 190);
  }

  function flyTile(tile, sourceRect, trayIndex) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const slot = traySlotEls[trayIndex];
    if (!slot) return;
    const target = slot.getBoundingClientRect();
    const type = typeOf(tile);
    const clone = document.createElement('div');
    clone.className = 'flying-tile';
    clone.style.left = `${sourceRect.left}px`;
    clone.style.top = `${sourceRect.top}px`;
    clone.style.width = `${sourceRect.width}px`;
    clone.style.height = `${sourceRect.height}px`;
    clone.style.setProperty('--tile-bg', type.bg);
    clone.style.setProperty('--tile-edge', type.edge);
    clone.innerHTML = `<svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-${type.id}"></use></svg>`;
    document.body.appendChild(clone);

    const dx = target.left + target.width / 2 - (sourceRect.left + sourceRect.width / 2);
    const dy = target.top + target.height / 2 - (sourceRect.top + sourceRect.height / 2);
    const scale = Math.max(0.35, target.width / sourceRect.width);
    const animation = clone.animate([
      { transform: 'translate(0, 0) scale(1)', opacity: 1 },
      { transform: `translate(${dx * 0.55}px, ${dy * 0.42 - 30}px) scale(${Math.max(scale, 0.82)})`, opacity: 1, offset: 0.55 },
      { transform: `translate(${dx}px, ${dy}px) scale(${scale})`, opacity: 0.92 }
    ], {
      duration: 275,
      easing: 'cubic-bezier(.22, .8, .28, 1)'
    });
    animation.onfinish = () => clone.remove();
    animation.oncancel = () => clone.remove();
  }

  function resolveTray() {
    if (state.status !== 'playing') return;

    const epoch = state.epoch;
    const triple = findTriple();
    if (triple) {
      state.matching = new Set(triple);
      state.lock = true;
      renderTray();
      renderHUD();
      playSfx('match');
      announce('三张相同，消除成功');

      window.setTimeout(() => {
        if (epoch !== state.epoch) return;
        triple.forEach(id => {
          const tile = tileById(id);
          if (tile) tile.status = 'removed';
        });
        state.tray = state.tray.filter(id => !triple.includes(id));
        state.history = state.history.filter(id => !triple.includes(id));
        state.matching = new Set();
        state.justAdded = null;

        if (isWon()) {
          refreshAll();
          win();
        } else {
          state.lock = false;
          refreshAll();
        }
      }, 310);
      return;
    }

    if (state.tray.length >= MAX_TRAY) {
      lose();
      return;
    }

    state.lock = false;
    refreshAll();
    if (state.tray.length === MAX_TRAY - 1) {
      toast('只剩最后一个格子啦，小心！');
      playSfx('nope');
    }
  }

  function findTriple() {
    const byType = new Map();
    for (const id of state.tray) {
      const type = tileById(id).type;
      if (!byType.has(type)) byType.set(type, []);
      byType.get(type).push(id);
      if (byType.get(type).length === 3) return byType.get(type);
    }
    return null;
  }

  function isWon() {
    return state.tiles.every(tile => tile.status === 'removed');
  }

  function useUndo() {
    if (state.status !== 'playing' || state.lock || state.props.undo <= 0 || state.history.length === 0) return;
    let id = state.history.pop();
    let tile = tileById(id);
    while (tile && tile.status !== 'tray' && state.history.length > 0) {
      id = state.history.pop();
      tile = tileById(id);
    }
    if (!tile || tile.status !== 'tray') return;

    state.tray = state.tray.filter(trayId => trayId !== id);
    tile.status = 'board';
    state.props.undo -= 1;
    state.lock = false;
    playSfx('undo');
    toast('已撤销上一张牌');
    announce('已撤销上一张牌');
    refreshAll();
  }

  function useShuffle() {
    if (state.status !== 'playing' || state.lock || state.props.shuffle <= 0) return;
    const boardTiles = state.tiles.filter(t => t.status === 'board');
    if (boardTiles.length === 0) return;

    const types = boardTiles.map(t => t.type);
    shuffleArray(types);
    boardTiles.forEach((tile, i) => {
      tile.type = types[i];
      const type = typeOf(tile);
      tile.el.style.setProperty('--tile-bg', type.bg);
      tile.el.style.setProperty('--tile-edge', type.edge);
      tile.el.querySelector('use').setAttribute('href', `#i-${type.id}`);
    });

    state.props.shuffle -= 1;
    playSfx('shuffle');
    toast('牌面已重新打乱');
    announce('牌面已重新打乱');
    boardInner.animate([
      { filter: 'brightness(1)' },
      { filter: 'brightness(1.16)' },
      { filter: 'brightness(1)' }
    ], { duration: 320, easing: 'ease' });
    refreshAll();
  }

  function useRemove() {
    if (state.status !== 'playing' || state.lock || state.props.remove <= 0 || state.tray.length === 0) return;
    if (state.hold.length >= MAX_HOLD) return;

    const count = Math.min(MAX_HOLD - state.hold.length, state.tray.length, 3);
    const moved = state.tray.splice(0, count);
    moved.forEach(id => {
      const tile = tileById(id);
      tile.status = 'hold';
      state.hold.push(id);
      state.history = state.history.filter(historyId => historyId !== id);
    });

    state.props.remove -= 1;
    playSfx('remove');
    toast(`已移出 ${moved.length} 张牌到暂存区`);
    announce(`已移出 ${moved.length} 张牌到暂存区`);
    refreshAll();
  }

  function onHoldClick(id) {
    if (state.status !== 'playing' || state.lock) return;
    if (state.tray.length >= MAX_TRAY) {
      toast('卡槽已满，先把同类牌消掉吧');
      playSfx('nope');
      return;
    }
    const tile = tileById(id);
    if (!tile || tile.status !== 'hold') return;

    state.hold = state.hold.filter(holdId => holdId !== id);
    tile.status = 'tray';
    let insertAt = -1;
    for (let i = 0; i < state.tray.length; i++) {
      if (tileById(state.tray[i]).type === tile.type) insertAt = i;
    }
    if (insertAt === -1) state.tray.push(tile.id);
    else state.tray.splice(insertAt + 1, 0, tile.id);

    const epoch = state.epoch;
    state.lock = true;
    state.moves += 1;
    state.justAdded = tile.id;
    playSfx('pick');
    refreshAll();
    window.setTimeout(() => {
      if (epoch !== state.epoch) return;
      state.justAdded = null;
      renderTray();
    }, 340);
    window.setTimeout(() => {
      if (epoch !== state.epoch) return;
      resolveTray();
    }, 160);
  }

  function win() {
    state.status = 'won';
    state.lock = true;
    state.endedAt = performance.now();
    const epoch = state.epoch;
    playSfx('win');
    announce('通关成功');
    burstConfetti();
    refreshAll();
    window.setTimeout(() => {
      if (epoch === state.epoch) showEndOverlay(true);
    }, 620);
  }

  function lose() {
    state.status = 'lost';
    state.lock = true;
    state.endedAt = performance.now();
    const epoch = state.epoch;
    playSfx('lose');
    announce('卡槽已满，挑战失败');
    trayShelf.classList.add('shake');
    window.setTimeout(() => {
      if (epoch === state.epoch) trayShelf.classList.remove('shake');
    }, 620);
    refreshAll();
    window.setTimeout(() => {
      if (epoch === state.epoch) showEndOverlay(false);
    }, 760);
  }

  function showEndOverlay(won) {
    const seconds = state.startedAt ? state.endedAt - state.startedAt : 0;
    const cleared = state.tiles.filter(t => t.status === 'removed').length;

    endCard.classList.toggle('is-lost', !won);
    endBadge.textContent = won ? '🏆' : '😵';
    endTitle.textContent = won
      ? (state.levelIndex === LEVELS.length - 1 ? '两关全清！' : '第一关拿下！')
      : '卡槽满了…';
    endText.textContent = won
      ? (state.levelIndex === LEVELS.length - 1
        ? '两座牌堆都清空啦，你就是这片草原最靓的仔。'
        : '开胃菜结束。第二关牌堆更厚、层数更多，敢不敢继续？')
      : '差一点点就清完了。理一理卡槽里的牌，再试一次吧。';

    statTime.textContent = formatTime(seconds);
    statMoves.textContent = String(state.moves);
    statCleared.textContent = String(cleared);

    nextBtn.hidden = !won || state.levelIndex >= LEVELS.length - 1;
    nextBtn.textContent = '挑战第二关';

    if (won) {
      replayBtn.textContent = state.levelIndex === LEVELS.length - 1 ? '再玩一次' : '重玩第一关';
      homeBtn.hidden = true;
    } else {
      replayBtn.textContent = '再试一次';
      homeBtn.hidden = state.levelIndex === 0;
      homeBtn.textContent = '回到第一关';
    }

    toastEl.classList.remove('show');
    endOverlay.hidden = false;
    syncInert();
    window.setTimeout(() => replayBtn.focus({ preventScroll: true }), 30);
  }

  function hideEndOverlay() {
    endOverlay.hidden = true;
    syncInert();
  }

  function syncInert() {
    const modalOpen = !startOverlay.hidden || !endOverlay.hidden;
    gameShell.inert = modalOpen;
    document.body.classList.toggle('overlay-open', modalOpen);
  }

  function startGame() {
    if (state.status !== 'idle') return;
    state.status = 'playing';
    state.startedAt = performance.now();
    ensureAudio();
    playSfx('start');
    closeStartOverlay();
    refreshAll();
    announce('第一关开始，点击没有被压住的牌');
  }

  function closeStartOverlay() {
    if (startClosing) return;
    startClosing = true;
    startOverlay.classList.add('is-closing');
    window.setTimeout(() => {
      startOverlay.hidden = true;
      startOverlay.classList.remove('is-closing');
      startClosing = false;
      syncInert();
    }, 270);
  }

  /* ------------------------------ effects ------------------------------ */

  function burstConfetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const canvas = confettiCanvas;
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const width = window.innerWidth;
    const height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const colors = ['#f4c84a', '#ef8a6d', '#78bd67', '#75b7dc', '#d59be0', '#f5e8b6'];
    const count = Math.min(150, Math.floor(width / 9));
    const particles = Array.from({ length: count }, () => ({
      x: width * (0.18 + Math.random() * 0.64),
      y: height * (0.24 + Math.random() * 0.2),
      vx: (Math.random() - 0.5) * 8,
      vy: -Math.random() * 8 - 2,
      g: 0.14 + Math.random() * 0.1,
      w: 5 + Math.random() * 7,
      h: 3 + Math.random() * 6,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.25,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 1
    }));

    const started = performance.now();
    const duration = 2600;
    const run = ++confettiRun;

    function frame(now) {
      if (run !== confettiRun) return;
      const elapsed = now - started;
      ctx.clearRect(0, 0, width, height);
      if (elapsed > duration) {
        ctx.clearRect(0, 0, width, height);
        return;
      }
      for (const p of particles) {
        p.vy += p.g;
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.995;
        p.rot += p.vr;
        p.life = Math.max(0, 1 - Math.max(0, elapsed - 1600) / 1000);
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ------------------------------ events ------------------------------ */

  startBtn.addEventListener('click', startGame);

  soundBtn.addEventListener('click', () => {
    state.sound = !state.sound;
    try { localStorage.setItem('sheep-sound', state.sound ? 'on' : 'off'); } catch (_) { /* ignore */ }
    applySoundPreference();
    if (state.sound) {
      ensureAudio();
      playSfx('pick');
    }
  });

  restartBtn.addEventListener('click', () => {
    initLevel(state.levelIndex, false);
    ensureAudio();
    playSfx('start');
    toast(`已重开${LEVELS[state.levelIndex].label}`);
  });

  undoBtn.addEventListener('click', useUndo);
  shuffleBtn.addEventListener('click', useShuffle);
  removeBtn.addEventListener('click', useRemove);

  holdSlotsEl.addEventListener('click', event => {
    const button = event.target.closest('[data-hold-id]');
    if (!button) return;
    onHoldClick(Number(button.dataset.holdId));
  });

  nextBtn.addEventListener('click', () => {
    const next = Math.min(state.levelIndex + 1, LEVELS.length - 1);
    hideEndOverlay();
    initLevel(next, false);
    ensureAudio();
    playSfx('start');
  });

  replayBtn.addEventListener('click', () => {
    const level = state.status === 'won' && state.levelIndex === LEVELS.length - 1 ? 0 : state.levelIndex;
    hideEndOverlay();
    initLevel(level, false);
    ensureAudio();
    playSfx('start');
  });

  homeBtn.addEventListener('click', () => {
    hideEndOverlay();
    initLevel(0, false);
    ensureAudio();
    playSfx('start');
  });

  window.addEventListener('resize', fitBoard);
  window.addEventListener('orientationchange', () => window.setTimeout(fitBoard, 60));

  /* ------------------------------ boot / debug ------------------------------ */

  applySoundPreference();
  initLevel(0, true);
  fitBoard();
  syncInert();
  window.setTimeout(fitBoard, 60);

  window.__sheepGame = {
    version: 1,
    getState() {
      return {
        level: state.levelIndex + 1,
        status: state.status,
        total: state.total,
        remaining: state.tiles.filter(t => t.status !== 'removed').length,
        clear: state.tiles.filter(t => t.status === 'removed').length,
        tray: state.tray.map(id => tileById(id).type),
        hold: state.hold.map(id => tileById(id).type),
        exposed: state.tiles
          .filter(t => t.status === 'board' && !t.blocked)
          .map(t => ({ id: t.id, type: t.type, layer: t.layer })),
        board: state.tiles.filter(t => t.status === 'board').length,
        props: { ...state.props },
        lock: state.lock,
        moves: state.moves,
        overlay: {
          start: !startOverlay.hidden,
          end: !endOverlay.hidden
        },
        solution: debugMode ? [...state.solution] : undefined
      };
    },
    startLevel(index, preview = false) {
      initLevel(index, preview);
    },
    clickTile(id) {
      const tile = tileById(Number(id));
      if (tile) tile.el.click();
    },
    tileRect(id) {
      const tile = tileById(Number(id));
      if (!tile) return null;
      const r = tile.el.getBoundingClientRect();
      return { x: r.x, y: r.y, width: r.width, height: r.height };
    }
  };
})();
</script>
</body>
